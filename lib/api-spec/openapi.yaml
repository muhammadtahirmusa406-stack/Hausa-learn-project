openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Hausa language learning app API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lessons
    description: Lesson operations
  - name: exercises
    description: Exercise operations
  - name: progress
    description: User progress operations
  - name: vocabulary
    description: Vocabulary operations
  - name: units
    description: Unit (course section) operations
  - name: goals
    description: Daily goal operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: gamification
    description: Achievements, leaderboard, and daily challenge
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /units:
    get:
      operationId: getUnits
      tags: [units]
      summary: Get all units with progress and lock state
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"

  /units/{id}/unlock:
    post:
      operationId: unlockUnit
      tags: [units]
      summary: Unlock a unit via checkpoint (skip prerequisite)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unit unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockUnitResult"
        "404":
          description: Unit not found

  /lessons:
    get:
      operationId: getLessons
      tags: [lessons]
      summary: List all lessons
      responses:
        "200":
          description: List of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"

  /lessons/categories:
    get:
      operationId: getLessonCategories
      tags: [lessons]
      summary: Get all lesson categories with progress
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonCategory"

  /lessons/{id}:
    get:
      operationId: getLesson
      tags: [lessons]
      summary: Get a lesson by ID with exercises
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson details with exercises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonDetail"
        "404":
          description: Lesson not found

  /lessons/{id}/complete:
    post:
      operationId: completeLesson
      tags: [lessons]
      summary: Mark a lesson as complete and earn XP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonCompleteInput"
      responses:
        "200":
          description: Lesson completion result with XP earned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonCompleteResult"

  /exercises/{lessonId}:
    get:
      operationId: getExercises
      tags: [exercises]
      summary: Get all exercises for a lesson
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"

  /exercises/{id}/answer:
    post:
      operationId: submitAnswer
      tags: [exercises]
      summary: Submit an answer to an exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Answer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"

  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get user overall progress
      responses:
        "200":
          description: User progress stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"

  /progress/activity:
    get:
      operationId: getActivityFeed
      tags: [progress]
      summary: Get recent learning activity and milestones
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /goals/daily:
    get:
      operationId: getDailyGoal
      tags: [goals]
      summary: Get today's daily learning goal
      responses:
        "200":
          description: Daily goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyGoal"

  /vocabulary:
    get:
      operationId: getVocabulary
      tags: [vocabulary]
      summary: Get vocabulary list
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Vocabulary list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabWord"

  /vocabulary/random:
    get:
      operationId: getRandomVocab
      tags: [vocabulary]
      summary: Get random vocabulary words for quick practice
      responses:
        "200":
          description: Random vocab words
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabWord"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect on success or failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

  /achievements:
    get:
      operationId: getAchievements
      tags: [gamification]
      summary: Get all achievements with unlock status
      responses:
        "200":
          description: Achievement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [gamification]
      summary: Get top users by XP
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /daily-challenge:
    get:
      operationId: getDailyChallenge
      tags: [gamification]
      summary: Get today's daily challenge
      responses:
        "200":
          description: Daily challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyChallenge"

  /daily-challenge/complete:
    post:
      operationId: completeDailyChallenge
      tags: [gamification]
      summary: Submit answer for daily challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Unit:
      type: object
      required: [id, title, description, iconEmoji, order, isLocked, isCompleted, completedLessons, totalLessons, xpRequired]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        iconEmoji:
          type: string
        order:
          type: integer
        isLocked:
          type: boolean
        isCompleted:
          type: boolean
        completedLessons:
          type: integer
        totalLessons:
          type: integer
        xpRequired:
          type: integer
        checkpointUnlocked:
          type: boolean

    UnlockUnitResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    Lesson:
      type: object
      required: [id, title, description, category, xpReward, order, isUnlocked, isCompleted, exerciseCount]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        xpReward:
          type: integer
        order:
          type: integer
        isUnlocked:
          type: boolean
        isCompleted:
          type: boolean
        exerciseCount:
          type: integer
        iconEmoji:
          type: ["string", "null"]
        unitId:
          type: ["integer", "null"]

    LessonCategory:
      type: object
      required: [name, lessons, completedCount, totalCount]
      properties:
        name:
          type: string
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
        completedCount:
          type: integer
        totalCount:
          type: integer

    LessonDetail:
      type: object
      required: [id, title, description, category, xpReward, order, isUnlocked, isCompleted, exerciseCount, exercises]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        xpReward:
          type: integer
        order:
          type: integer
        isUnlocked:
          type: boolean
        isCompleted:
          type: boolean
        exerciseCount:
          type: integer
        iconEmoji:
          type: ["string", "null"]
        unitId:
          type: ["integer", "null"]
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"

    Exercise:
      type: object
      required: [id, lessonId, type, question, options, order]
      properties:
        id:
          type: integer
        lessonId:
          type: integer
        type:
          type: string
          enum: [multiple_choice, translation, fill_blank, match_pair, typing]
        question:
          type: string
        hausa:
          type: ["string", "null"]
        english:
          type: ["string", "null"]
        options:
          type: array
          items:
            type: string
        order:
          type: integer
        hint:
          type: ["string", "null"]
        audioWord:
          type: ["string", "null"]

    LessonCompleteInput:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          description: Number of correct answers
        totalQuestions:
          type: integer

    LessonCompleteResult:
      type: object
      required: [xpEarned, totalXp, streak, isNewBest]
      properties:
        xpEarned:
          type: integer
        totalXp:
          type: integer
        streak:
          type: integer
        isNewBest:
          type: boolean
        message:
          type: ["string", "null"]
        newAchievements:
          type: array
          items:
            type: string

    AnswerInput:
      type: object
      required: [answer]
      properties:
        answer:
          type: string

    AnswerResult:
      type: object
      required: [isCorrect, correctAnswer]
      properties:
        isCorrect:
          type: boolean
        correctAnswer:
          type: string
        explanation:
          type: ["string", "null"]

    UserProgress:
      type: object
      required: [totalXp, streak, completedLessons, totalLessons, level, weeklyXp]
      properties:
        totalXp:
          type: integer
        streak:
          type: integer
        completedLessons:
          type: integer
        totalLessons:
          type: integer
        level:
          type: integer
        weeklyXp:
          type: integer
        longestStreak:
          type: integer
        dailyGoalXp:
          type: integer
        dailyGoalCompleted:
          type: boolean

    DailyGoal:
      type: object
      required: [xpTarget, xpEarned, wordsTarget, wordsCompleted, lessonsTarget, lessonsCompleted, isCompleted]
      properties:
        xpTarget:
          type: integer
        xpEarned:
          type: integer
        wordsTarget:
          type: integer
        wordsCompleted:
          type: integer
        lessonsTarget:
          type: integer
        lessonsCompleted:
          type: integer
        isCompleted:
          type: boolean

    ActivityItem:
      type: object
      required: [id, type, description, xp, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        xp:
          type: integer
        createdAt:
          type: string

    VocabWord:
      type: object
      required: [id, hausa, english, category, pronunciation]
      properties:
        id:
          type: integer
        hausa:
          type: string
        english:
          type: string
        category:
          type: string
        pronunciation:
          type: string
        example:
          type: ["string", "null"]
        exampleTranslation:
          type: ["string", "null"]

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Achievement:
      type: object
      required: [id, key, title, description, xpReward, isUnlocked, iconEmoji]
      properties:
        id:
          type: integer
        key:
          type: string
        title:
          type: string
        description:
          type: string
        xpReward:
          type: integer
        isUnlocked:
          type: boolean
        iconEmoji:
          type: string
        unlockedAt:
          type: ["string", "null"]

    LeaderboardEntry:
      type: object
      required: [rank, userId, displayName, totalXp, streak, level]
      properties:
        rank:
          type: integer
        userId:
          type: string
        displayName:
          type: string
        totalXp:
          type: integer
        streak:
          type: integer
        level:
          type: integer
        profileImageUrl:
          type: ["string", "null"]

    DailyChallenge:
      type: object
      required: [id, question, options, xpReward, isCompleted, expiresAt]
      properties:
        id:
          type: integer
        question:
          type: string
        hausa:
          type: ["string", "null"]
        english:
          type: ["string", "null"]
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: ["string", "null"]
        xpReward:
          type: integer
        isCompleted:
          type: boolean
        expiresAt:
          type: string

  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
