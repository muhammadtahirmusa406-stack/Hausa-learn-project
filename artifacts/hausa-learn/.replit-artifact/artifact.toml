kind = "web"
previewPath = "/"
title = "Hausa Learn"
version = "1.0.0"
id = "artifacts/hausa-learn"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23494

[services.development]
run = "pnpm --filter @workspace/hausa-learn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hausa-learn", "run", "build" ]
publicDir = "artifacts/hausa-learn/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23494"
BASE_PATH = "/"
